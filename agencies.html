<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOVA // Global Space Agencies & Outreach</title>
  <meta name="description" content="Verified global aerospace agency directory, server-cached telemetry feeds, and official scientific research outreach portals." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%2302040A' stroke='%235CC8FF' stroke-width='4'/><circle cx='50' cy='50' r='12' fill='%235CC8FF'/></svg>" />
  <link rel="stylesheet" href="/css/social.css" />
  <link rel="stylesheet" href="/css/avatar.css" />
  <link rel="stylesheet" href="/css/ui.css" />
  <meta name="csrf-token" content="" />
  <style>
    .agencies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      margin-top: 24px;
    }
    .agency-card {
      background: var(--bg-card);
      border: var(--border-hairline);
      border-radius: var(--radius-tech);
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backdrop-filter: blur(12px);
      transition: all 0.2s ease;
    }
    .agency-card:hover {
      border-color: rgba(92, 200, 255, 0.4);
      transform: translateY(-2px);
    }
    .agency-logo-badge {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-tech);
      border: 1px solid var(--accent-gold);
      background: rgba(251, 191, 36, 0.08);
      color: var(--accent-gold);
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .agency-title {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      margin-top: 12px;
      margin-bottom: 4px;
    }
    .agency-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 16px;
      flex: 1;
    }
    .agency-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: var(--border-subtle);
      padding-top: 14px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <canvas id="starfield-canvas"></canvas>

  <div class="page-wrapper">
    <div id="shared-navbar-container"></div>

    <main class="main-container">
      <div class="page-header-row" style="margin-bottom: 20px;">
        <div>
          <span class="mono-label">// AEROSPACE DIRECTORY & TELEMETRY</span>
          <h1 class="page-title">GLOBAL SPACE AGENCIES</h1>
          <p class="page-subtitle">
            Explore the 8 verified national space agencies and the open General Space celestial channel. Follow agencies to tailor your transmission feed.
          </p>
        </div>
      </div>

      <!-- SEARCH DIRECTORY BAR -->
      <div style="margin-bottom: 24px;">
        <input type="text" id="agencies-search-input" class="form-input" placeholder="Filter agencies by name, code, or scientific mission focus..." style="max-width: 500px;" />
      </div>

      <div class="agencies-grid" id="agencies-grid-container">
        <div class="agency-card">
          <div class="skeleton-box" style="height: 44px; width: 44px; margin-bottom: 12px;"></div>
          <div class="skeleton-box" style="height: 20px; width: 60%; margin-bottom: 8px;"></div>
          <div class="skeleton-box" style="height: 14px; width: 90%;"></div>
        </div>
        <div class="agency-card">
          <div class="skeleton-box" style="height: 44px; width: 44px; margin-bottom: 12px;"></div>
          <div class="skeleton-box" style="height: 20px; width: 60%; margin-bottom: 8px;"></div>
          <div class="skeleton-box" style="height: 14px; width: 90%;"></div>
        </div>
      </div>
    </main>

    <div id="shared-footer-container"></div>
  </div>

  <script src="/js/ui.js"></script>
  <script src="/js/api.js"></script>
  <script type="module" src="/js/avatar.js"></script>
  <script type="module" src="/js/page-agencies.js"></script>
</body>
</html>
