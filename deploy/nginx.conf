# ==============================================================================
# NOVA Deep Space Observatory — Hardened Production Nginx Configuration
# Target: /etc/nginx/sites-available/nova.conf
# Symlink: ln -s /etc/nginx/sites-available/nova.conf /etc/nginx/sites-enabled/
# ==============================================================================

# Rate Limiting Zones (Defense against brute-force & denial-of-service)
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/m;

upstream nova_backend {
    server 127.0.0.1:8080 fail_timeout=0;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. HTTP Server (Port 80) — Mandatory 301 Redirect to HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN.duckdns.org; # Replace with your DuckDNS domain or Elastic IP
    server_tokens off;

    # Allow Let's Encrypt ACME challenge verification over port 80
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server (Port 443) — TLS Termination & Optimized Asset Proxy
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN.duckdns.org; # Replace with your DuckDNS domain or Elastic IP

    # Suppress Nginx server signature banners
    server_tokens off;

    # SSL Certificates (Managed via Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN.duckdns.org/privkey.pem;

    # Modern TLS Security Parameters (TLS 1.2+ Only)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Request Buffer & Size Ceiling (Matching app 5MB upload limit + overhead)
    client_max_body_size 6M;
    client_body_buffer_size 128k;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;

    # Gzip Compression for High-Performance Delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Root Directory for Static Assets
    root /opt/nova;
    index index.html;

    # Logging Paths (Monitored by AWS CloudWatch Agent)
    access_log /var/log/nginx/access.log combined;
    error_log  /var/log/nginx/error.log warn;

    # --------------------------------------------------------------------------
    # Block Sensitive Files, Directories, and Hidden Dotfiles
    # (Evaluated before static asset regex rules)
    # --------------------------------------------------------------------------
    location ~* \.(db|db-wal|db-shm|sqlite3?|log|py|sql|env|pem|key|bak|orig)$ {
        return 404;
    }

    location ~ /\. {
        return 404;
    }

    # Deny direct access to repository deploy configurations and internal directories
    location ^~ /deploy/ {
        return 404;
    }

    location ^~ /logs/ {
        return 404;
    }

    location = /requirements.txt {
        return 404;
    }

    # --------------------------------------------------------------------------
    # Static Assets Direct Delivery (Bypasses Flask WSGI for maximum throughput)
    # --------------------------------------------------------------------------
    # Restrict /data/ so it ONLY serves *.js data tables (galaxies.js, planets.js, etc.).
    # All other files or directory listing attempts in /data/ are blocked (404).
    location ~* ^/data/.*\.js$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Deny any non-js requests within /data/
    location /data/ {
        return 404;
    }

    # CSS & JavaScript files: 5-minute cache with mandatory revalidation (cache busting)
    location ~* ^/(css|js)/ {
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Static Media, Images & Fonts: 30-day long-term immutable caching
    location ~* \.(jpe?g|png|gif|ico|webp|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location = /robots.txt  { access_log off; log_not_found off; }
    location = /sitemap.xml { access_log off; log_not_found off; }
    location = /manifest.json { access_log off; log_not_found off; }

    # --------------------------------------------------------------------------
    # Authentication Endpoints Rate Limiting (Strict 5 req/min)
    # --------------------------------------------------------------------------
    location ~ ^/api/(login|register|forgot-password|reset-password) {
        limit_req zone=auth_zone burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://nova_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # API Routes Rate Limiting (15 req/sec burst 20)
    # --------------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_zone burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://nova_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # Dynamic WSGI Application Proxy (Flask / Gunicorn)
    # Note: Security headers (HSTS, CSP, X-Frame-Options, X-Content-Type-Options)
    # are set natively by Flask after_request to avoid header duplication.
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://nova_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
